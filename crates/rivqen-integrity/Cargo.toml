[package]
name = "rivqen-integrity"
description = "Rivqen core hashes: SHA-256, base64url and the RQP revision identifiers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
sha2.workspace = true
# Legacy SHA-1 (H-143).
sha1 = { workspace = true, optional = true }

[features]
default = ["legacy"]
# Legacy protocol: SHA-1 (DL-164). WP-23 removes it.
legacy = ["dep:sha1"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
