#
# cargo-deny policy of the core workspace (docs/engineering/core/dependencies.md
# section 3; DL-147). Run: cargo deny check
[graph]
all-features = true

[advisories]
# Every RustSec advisory, also unmaintained and unsound notices, fails the check.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "NCSA",
]
confidence-threshold = 0.93
# The allow list is the policy, not the current tree.
unused-allowed-license = "allow"
# MPL-2.0 only for the uniffi crates (dependencies section 2, rule 5).
exceptions = [
    { allow = ["MPL-2.0"], crate = "uniffi" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
