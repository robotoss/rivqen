[package]
name = "rivqen-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Rivqen reference server (oracle): RQP rqp/1 and the legacy profiles of ADR-005, tested by URL through server/conformance"
publish = false

# Own workspace: the reference server is not part of a repository workspace (DL-084).
[workspace]

[[bin]]
name = "rivqen-reference"
path = "src/main.rs"

# Dependencies: human decision H-113 (WP-03 S1). The architect owns this table.
[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
rqp-markup = { path = "../../tools/rqp-markup/rust" }
serde_json = "=1.0.151"
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# The server reads untrusted input (docs/engineering/standards/rust.md section 3).
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
panic = "unwind"
