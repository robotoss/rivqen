// Android client lab (WP-01, H-118): a Rivqen harness app around the unmodified upstream SDK sources.

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
    }
}

rootProject.name = 'rivqen-android-lab'
include ':app'
